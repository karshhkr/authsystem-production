# ==============================================================
# 1. DATABASE CONNECTION (NEON POSTGRES)
# ==============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-polished-math-amlj8f5t-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_bd7Neo0tRZVf}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# 2. HIBERNATE & JPA SETTINGS
# ==============================================================
# Removed deprecated database-platform property (Spring Boot auto-detects PostgreSQL Dialect)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==============================================================
# 3. HIKARI POOL SETTINGS
# ==============================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000

# ==============================================================
# 4. FLYWAY MIGRATION
# ==============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==============================================================
# 5. SERVER & JWT SECURITY
# ==============================================================
server.port=${PORT:8081}

app.jwt.secret=${JWT_SECRET:dev_secret_key_make_it_long_enough_1234567890_secure}
app.jwt.access-exp-min=15
app.jwt.refresh-exp-days=7

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG